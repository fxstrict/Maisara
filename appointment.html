<body data-page="appointment">
<main id="main">
<section class="intro"><div class="wrap narrow">
<span class="kicker">طلب موعد</span><h1>اطلب موعدًا</h1>
<p class="notice">هذا نموذج طلب موعد وليس حجزًا مؤكدًا. بعد الإرسال سيتم التواصل معك لتأكيد الموعد.</p>
<form id="appt-form">
<div class="field"><label for="a-name">الاسم</label><input id="a-name" required autocomplete="name"></div>
<div class="field"><label for="a-phone">رقم الهاتف</label><input id="a-phone" type="tel" inputmode="tel" dir="ltr" required autocomplete="tel"></div>
<div class="field"><label for="a-service">نوع الخدمة</label><select id="a-service"><option>استشارة قانونية</option><option>متابعة قضية</option><option>مراجعة مستندات أو عقود</option><option>أخرى</option></select></div>
<div class="field"><label for="a-spec">التخصص</label><select id="a-spec"></select></div>
<div class="field"><label for="a-when">الموعد المقترح</label><input id="a-when" placeholder="مثال: اليوم والفترة المناسبة لك"></div>
<div class="field"><label for="a-way">طريقة التواصل المفضلة</label><select id="a-way"><option>واتساب</option><option>اتصال هاتفي</option></select></div>
<div class="field"><label for="a-details">وصف مختصر للموضوع</label><textarea id="a-details"></textarea></div>
<button class="btn solid" type="submit">تجهيز الطلب عبر واتساب</button>
<p id="appt-out" class="form-note mt-s" role="status"></p>
</form></div></section>
</main>
